name: Purge Cloudflare cache

# Re-sync apk.pistar.uk with gh-pages by hand, e.g. when an index went
# stale before the deploy workflows purged correctly.
on:
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6

      - name: Wait for the live repository, then purge Cloudflare
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          SITE: https://apk.pistar.uk
          INDEX_PATHS: v3.23/community/x86_64/APKINDEX.tar.gz v3.23/community/armhf/APKINDEX.tar.gz v3.23/community/aarch64/APKINDEX.tar.gz v3.23/community/noarch/APKINDEX.tar.gz v3.22/community/x86_64/APKINDEX.tar.gz v3.22/community/armhf/APKINDEX.tar.gz v3.22/community/aarch64/APKINDEX.tar.gz v3.22/community/noarch/APKINDEX.tar.gz hamradio.rsa.pub
        run: scripts/wait-for-pages.sh

  # Keep the Actions history short (see cleanup-runs.yml)
  cleanup-runs:
    name: Cleanup old workflow runs
    needs: [purge]
    if: always()
    permissions:
      actions: write
    uses: ./.github/workflows/cleanup-runs.yml
